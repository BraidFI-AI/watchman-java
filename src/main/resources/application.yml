server:
  port: 8084
spring:
  application:
    name: watchman-java
  datasource:
    url: ${DAY_WATCHER_DB_URL:}
    username: ${DAY_WATCHER_DB_USERNAME:}
    password: ${DAY_WATCHER_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
watchman:
  download:
    enabled: true
    on-startup: true
    refresh-interval-ms: 43200000
    sources:
    - US_OFAC
    ofac:
      sdn-url: https://www.treasury.gov/ofac/downloads/sdn.csv
      add-url: https://www.treasury.gov/ofac/downloads/add.csv
      alt-url: https://www.treasury.gov/ofac/downloads/alt.csv
    csl:
      url: https://data.trade.gov/downloadable_consolidated_screening_list/v1/consolidated.csv
    eu-csl:
      url: https://webgate.ec.europa.eu/fsd/fsf/public/files/csvFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw
    uk-csl:
      url: https://ofsistorage.blob.core.windows.net/publishlive/2022format/ConList.csv
  similarity:
    jaro-winkler-boost-threshold: 0.8
    jaro-winkler-prefix-size: 5
    winkler-prefix-weight: 0.1
    minimum-token-length: 3
    phonetic-length-difference-threshold: 0.15
    short-token-ratio-threshold: 0.65
    length-difference-penalty-weight: 0.4
    length-difference-cutoff-factor: 0.85
    different-letter-penalty-weight: 0.95
    exact-match-favoritism: 0.1
    unmatched-index-token-weight: 0.2
    phonetic-filtering-disabled: true
    keep-stopwords: true
    log-stopword-debugging: true
    # JaroWinkler query-coverage boost + LanguageDetector (Phase 6 migration - Mar 16, 2026)
    query-coverage-quality-threshold: 0.95   # min tokenAvg to trigger coverage boost
    query-coverage-boost-multiplier: 1.08    # multiplier when all tokens match at high quality
    token-blend-weight: 0.6                  # weight for token-based score (full-string gets 1-this=0.4)
    language-detection-min-confidence: 0.5   # below this confidence, default to English
  search:
    alias-match-threshold: 0.75
    high-score-threshold: 0.95
    token-coverage-minimum: 0.4
    multi-token-query-threshold: 3
    normal-threshold-max: 0.88
    normal-threshold-min: 0.75
    short-query-token-threshold: 2
  weights:
    name-weight: 35.0
    address-weight: 25.0
    critical-id-weight: 50.0
    supporting-info-weight: 15.0
    minimum-score: 0.0
    exact-match-threshold: 0.99
    alias-tie-breaker-threshold: 0.95
    exact-match-critical-id-threshold: 0.99
    exact-match-id-weight: 0.7
    exact-match-name-weight: 0.3
    alias-score-multiplier: 1.2
    alias-minimum-score: 0.45
    alias-boost-max-score: 0.88
    alias-boost-amount: 0.5
    name-comparison-enabled: true
    alt-name-comparison-enabled: true
    address-comparison-enabled: true
    gov-id-comparison-enabled: true
    crypto-comparison-enabled: true
    contact-comparison-enabled: true
    date-comparison-enabled: true
    # Address field weights (from AddressComparer.java migration - Mar 6, 2026)
    address-line1-weight: 5.0   # Primary address line (most important)
    address-line2-weight: 2.0   # Secondary address info
    address-city-weight: 4.0    # City (highly important)
    address-state-weight: 2.0   # State/province
    address-postal-weight: 3.0  # Postal code (strong verification)
    address-country-weight: 4.0 # Country (critical for international)
    address-high-confidence-threshold: 0.92  # Early exit optimization
    # Date comparison weights (from DateComparer.java migration - Mar 6, 2026)
    date-year-decay-rate: 0.1        # 10% penalty per year difference
    date-distant-year-score: 0.2     # Floor score for >5 year difference
    date-month-tolerance1: 0.9       # Score for ±1 month difference
    date-month-tolerance2: 0.7       # Score for month 1 vs 10/11/12 typo
    date-month-tolerance3-plus: 0.3  # Default month score
    date-day-tolerance0to3-start: 0.95  # Starting score for ±3 day tolerance
    date-day-tolerance0to3-decay: 0.05  # Decay rate within ±3 days
    date-day-tolerance4to7: 0.7      # Score for similar day patterns (1 vs 11)
    date-day-tolerance8-plus: 0.3    # Default day score
    date-year-weight: 0.4            # Year component weight (40%)
    date-month-weight: 0.3           # Month component weight (30%)
    date-day-weight: 0.3             # Day component weight (30%)
    # SupportingInfo + Title thresholds (Phase 3 migration - Mar 16, 2026)
    supporting-info-matched-threshold: 0.5   # avgScore > this → matched=true
    supporting-info-exact-threshold: 0.99    # avgScore > this → exact=true
    supporting-info-secondary-penalty: 0.8   # multiplier when secondary sanctions status differs
    title-matched-threshold: 0.5             # bestScore > this → matched=true
    title-exact-threshold: 0.99              # bestScore > this → exact=true
    # Affiliation + Name thresholds (Phase 4 migration - Mar 16, 2026)
    affiliation-name-threshold: 0.85         # finalScore > this → matched=true
    affiliation-exact-threshold: 0.95        # nameScore > this AND typeScore > type-threshold → exact=true
    affiliation-type-score-threshold: 0.9    # min typeScore for exact affiliation match
    name-early-exit-threshold: 0.4           # names below this skip expensive comparisons
    # EntityScorerImpl.compareAddress() weights (Phase 5 migration - Mar 16, 2026)
    scorer-address-country-weight: 0.3       # country exact match contribution (sum: 0.3+0.3+0.4=1.0)
    scorer-address-city-weight: 0.3          # city JaroWinkler contribution
    scorer-address-line-weight: 0.4          # street line1 tokenized contribution
    # Alias selection (Phase 6 migration - Mar 16, 2026)
    alias-selection-tolerance: 0.05          # score delta within which coverage-based selection applies
    alias-coverage-min-score: 0.45           # minimum score to apply coverage-based alias selection
  auto-clearance:
    phase1-threshold: 0.85
    address-mismatch-threshold: 0.5
    dob-difference-threshold-years: 1
  bulk:
    input-bucket: ${WATCHMAN_BULK_INPUT_BUCKET:watchman-input}
    results-bucket: ${WATCHMAN_BULK_RESULTS_BUCKET:watchman-results}
    executor-threads: 5
  aws:
    batch:
      job-queue-arn: ${AWS_BATCH_JOB_QUEUE_ARN:arn:aws:batch:us-east-1:100095454503:job-queue/sandbox-watchman-queue}
      job-definition-arn: ${AWS_BATCH_JOB_DEFINITION_ARN:arn:aws:batch:us-east-1:100095454503:job-definition/sandbox-watchman-bulk-screening:3}
  webhook:
    enabled: false
    refresh-notification-url: ''
