server:
  port: 8084
spring:
  application:
    name: watchman-java
  datasource:
    url: ${DAY_WATCHER_DB_URL:}
    username: ${DAY_WATCHER_DB_USERNAME:}
    password: ${DAY_WATCHER_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  sql:
    init:
      mode: never
watchman:
  download:
    enabled: true
    on-startup: true
    refresh-interval-ms: 43200000
    sources:
    - US_OFAC
    ofac:
      sdn-url: https://www.treasury.gov/ofac/downloads/sdn.csv
      add-url: https://www.treasury.gov/ofac/downloads/add.csv
      alt-url: https://www.treasury.gov/ofac/downloads/alt.csv
    csl:
      url: https://data.trade.gov/downloadable_consolidated_screening_list/v1/consolidated.csv
    eu-csl:
      url: https://webgate.ec.europa.eu/fsd/fsf/public/files/csvFullSanctionsList_1_1/content?token=dG9rZW4tMjAxNw
    uk-csl:
      url: https://ofsistorage.blob.core.windows.net/publishlive/2022format/ConList.csv
  similarity:
    jaro-winkler-boost-threshold: 0.7
    jaro-winkler-prefix-size: 4
    winkler-prefix-weight: 0.1
    minimum-token-length: 3
    phonetic-length-difference-threshold: 0.1
    short-token-ratio-threshold: 0.6
    length-difference-penalty-weight: 0.3
    length-difference-cutoff-factor: 0.9
    different-letter-penalty-weight: 0.9
    exact-match-favoritism: 0.0
    unmatched-index-token-weight: 0.15
    phonetic-filtering-disabled: false
    keep-stopwords: false
    log-stopword-debugging: false
    query-coverage-quality-threshold: 0.95
    query-coverage-boost-multiplier: 1.08
    token-blend-weight: 0.6
    language-detection-min-confidence: 0.5
  search:
    alias-match-threshold: 0.75
    high-score-threshold: 0.95
    token-coverage-minimum: 0.4
    multi-token-query-threshold: 3
    normal-threshold-max: 0.88
    normal-threshold-min: 0.75
    short-query-token-threshold: 2
  weights:
    name-weight: 35.0
    address-weight: 25.0
    critical-id-weight: 50.0
    supporting-info-weight: 15.0
    minimum-score: 0.88
    exact-match-threshold: 0.99
    alias-tie-breaker-threshold: 0.95
    exact-match-critical-id-threshold: 0.99
    exact-match-id-weight: 0.7
    exact-match-name-weight: 0.3
    alias-score-multiplier: 1.2
    alias-minimum-score: 0.45
    alias-boost-max-score: 0.88
    alias-boost-amount: 0.5
    name-comparison-enabled: true
    alt-name-comparison-enabled: true
    address-comparison-enabled: true
    gov-id-comparison-enabled: true
    crypto-comparison-enabled: true
    contact-comparison-enabled: true
    date-comparison-enabled: true
    address-line1-weight: 5.0
    address-line2-weight: 2.0
    address-city-weight: 4.0
    address-state-weight: 2.0
    address-postal-weight: 3.0
    address-country-weight: 4.0
    address-high-confidence-threshold: 0.92
    date-year-decay-rate: 0.1
    date-distant-year-score: 0.2
    date-month-tolerance1: 0.9
    date-month-tolerance2: 0.7
    date-month-tolerance3-plus: 0.3
    date-day-tolerance0to3-start: 0.95
    date-day-tolerance0to3-decay: 0.05
    date-day-tolerance4to7: 0.7
    date-day-tolerance8-plus: 0.3
    date-year-weight: 0.4
    date-month-weight: 0.3
    date-day-weight: 0.3
    supporting-info-matched-threshold: 0.5
    supporting-info-exact-threshold: 0.99
    supporting-info-secondary-penalty: 0.8
    title-matched-threshold: 0.5
    title-exact-threshold: 0.99
    affiliation-name-threshold: 0.85
    affiliation-exact-threshold: 0.95
    affiliation-type-score-threshold: 0.9
    name-early-exit-threshold: 0.4
    scorer-address-country-weight: 0.3
    scorer-address-city-weight: 0.3
    scorer-address-line-weight: 0.4
    alias-selection-tolerance: 0.05
    alias-coverage-min-score: 0.45
  auto-clearance:
    phase1-threshold: 0.85
    address-mismatch-threshold: 0.5
    dob-difference-threshold-years: 1
  config:
    bucket: ${WATCHMAN_CONFIG_BUCKET:}
  bulk:
    input-bucket: ${WATCHMAN_BULK_INPUT_BUCKET:watchman-input}
    results-bucket: ${WATCHMAN_BULK_RESULTS_BUCKET:watchman-results}
    executor-threads: 5
  aws:
    batch:
      job-queue-arn: ${AWS_BATCH_JOB_QUEUE_ARN:arn:aws:batch:us-east-1:100095454503:job-queue/sandbox-watchman-queue}
      job-definition-arn: ${AWS_BATCH_JOB_DEFINITION_ARN:arn:aws:batch:us-east-1:100095454503:job-definition/sandbox-watchman-bulk-screening:3}
  webhook:
    enabled: false
    refresh-notification-url: ''
